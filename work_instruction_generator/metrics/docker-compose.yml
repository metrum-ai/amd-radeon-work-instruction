services:
  amd-device-metrics-exporter:
    image: rocm/device-metrics-exporter:v1.4.2
    container_name: wig_amd_device_metrics
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    volumes:
      - /sys:/sys:ro
    security_opt:
      - seccomp:unconfined
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    networks:
      - wig-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: wig_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - >-
        --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - wig-net

  # ------------------------------------------------------------
  # Prometheus
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: wig_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      amd-device-metrics-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    restart: unless-stopped
    networks:
      - wig-net

volumes:
  prometheus_data:

networks:
  wig-net:
