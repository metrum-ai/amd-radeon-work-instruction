events {}

http {
    log_format upstream_debug '$time_iso8601 "$request" upstream=$upstream_addr status=$status upstream_status=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstream_debug;

    upstream lemonade_backends {
        least_conn;  # route to backend with fewest active connections — critical for ~55s Flux jobs
        server lemonade-1:13305;
        server lemonade-2:13305;
    }

    upstream inference_backends {
        least_conn;  # same rationale for long LLM inference requests
        server llm-inference-1:8000;
        server llm-inference-2:8000;
    }

    server {
        listen 13305;
        location / {
            proxy_pass         http://lemonade_backends;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # Ground truth for per-instance metrics attribution — callers should read this
            # instead of guessing which backend handled the request after the fact.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    server {
        listen 8000;
        location / {
            proxy_pass         http://inference_backends;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
