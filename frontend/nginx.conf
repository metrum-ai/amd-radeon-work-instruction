server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /prometheus/ {
        resolver 127.0.0.11 valid=10s;
        set $prom_upstream http://wig_prometheus:9090;

        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $prom_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /manuals/ {
        alias /usr/share/nginx/manuals/;
        add_header Content-Disposition inline;
        add_header Content-Type application/pdf;
    }

    location /sop-docs/ {
        alias /usr/share/nginx/sop-docs/;
        add_header Content-Disposition inline;
        add_header Content-Type application/pdf;
    }

    location /procedure-docs/ {
        alias /usr/share/nginx/procedure-docs/;
        add_header Content-Disposition inline;
        add_header Content-Type application/pdf;
    }

    location /api/ {
        # Use Docker's internal resolver so DNS is resolved per-request,
        # not at startup — allows nginx to start before the api container is up.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://wig-api:8000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # SSE requires no buffering and a persistent connection
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
